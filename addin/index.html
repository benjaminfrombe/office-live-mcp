<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Live MCP</title>
  <!-- Office.js MUST be in head, before any other scripts -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link rel="stylesheet" href="style.css?v=63">
</head>
<body>
  <div class="mode-tabs">
    <button id="tab-bridge" class="mode-tab active" type="button">Bridge</button>
    <button id="tab-chat" class="mode-tab" type="button">OpenCode Chat</button>
  </div>

  <div id="mode-bridge" class="mode-panel">
    <div id="status" class="status disconnected">Initializing...</div>
    <p class="info">MCP bridge for AI assistants to edit this document via Office.js.</p>
    <p class="detail">Bridge address: <span id="bridge-url">...</span></p>
    <p class="closeable-hint">You can close this panel — the connection stays active. It auto-opens to reconnect to MCP. Find it in the <b>Add-ins</b> ribbon if needed.</p>
  </div>

  <div id="mode-chat" class="mode-panel hidden">
    <div class="chat-toolbar">
      <select id="oc-session"></select>
      <button id="oc-new-session" type="button">New session</button>
    </div>
    <div class="activity-row">
      <div id="oc-status" class="chat-status"></div>
      <div id="oc-reasoning-strip" class="reasoning-strip" hidden>
        <span class="reasoning-icon"></span>
        <span id="oc-reasoning-label" class="reasoning-label">Reasoning</span>
        <div class="reasoning-window"><pre id="oc-reasoning-text" class="reasoning-text"><span></span><span></span></pre></div>
      </div>
    </div>
    <div id="oc-messages" class="chat-messages"></div>
    <div id="oc-form-cards" class="form-cards"></div>
    <div id="oc-selection-chips" class="selection-chips"></div>
    <div id="oc-attachment-chips" class="attachment-chips"></div>
    <div class="chat-input">
      <textarea id="oc-input" rows="2" placeholder="Ask OpenCode…"></textarea>
      <div class="chat-input-actions">
        <button id="oc-use-selection" type="button" title="Paste the current document selection into the input">+ Selection</button>
        <select id="oc-model"></select>
        <span class="chat-input-spacer"></span>
        <button id="oc-stop" type="button" class="stop" hidden>Stop</button>
        <button id="oc-send" type="button" class="primary">Send</button>
      </div>
    </div>
  </div>

  <script src="opencode.js?v=63"></script>
  <script src="forms.js?v=63"></script>
  <script src="vendor/markdown-it-14.3.3.min.js"></script>
  <script src="markdown.js?v=63"></script>
  <script src="chat.js?v=63"></script>
  <script src="app.js?v=63"></script>
</body>
</html>
