<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Live MCP</title>
  <!-- Office.js MUST be in head, before any other scripts -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <h1>Office Live MCP</h1>
  <div class="mode-tabs">
    <button id="tab-bridge" class="mode-tab active" type="button">Bridge</button>
    <button id="tab-chat" class="mode-tab" type="button">OpenCode Chat</button>
  </div>

  <div id="mode-bridge" class="mode-panel">
    <div id="status" class="status disconnected">Initializing...</div>
    <p class="info">MCP bridge for AI assistants to edit this document via Office.js.</p>
    <p class="detail">Bridge address: <span id="bridge-url">...</span></p>
    <p class="closeable-hint">You can close this panel — the connection stays active. It auto-opens to reconnect to MCP. Find it in the <b>Add-ins</b> ribbon if needed.</p>
  </div>

  <div id="mode-chat" class="mode-panel hidden">
    <details class="chat-config">
      <summary>Connection</summary>
      <div class="chat-config-body">
        <input id="oc-server-url" type="text" placeholder="OpenCode server URL (https://127.0.0.1:4096)">
        <button id="oc-save-config" type="button">Save &amp; connect</button>
        <div class="chat-advanced">
          <button id="oc-toggle-advanced" type="button" class="link-button">Direct connection…</button>
          <input id="oc-password" type="password" placeholder="Service password (direct connection only)" class="hidden">
        </div>
      </div>
    </details>
    <div class="chat-toolbar">
      <select id="oc-session"></select>
      <button id="oc-new-session" type="button">New session</button>
    </div>
    <div id="oc-status" class="chat-status"></div>
    <div id="oc-messages" class="chat-messages"></div>
    <div id="oc-selection-chip" class="selection-chip hidden">
      <span id="oc-selection-label"></span>
      <button id="oc-selection-clear" type="button" title="Remove selection context">✕</button>
    </div>
    <div class="chat-input">
      <textarea id="oc-input" rows="4" placeholder="Ask OpenCode..."></textarea>
      <div class="chat-input-actions">
        <button id="oc-use-selection" type="button" title="Paste the current document selection into the input">+ Selection</button>
        <button id="oc-insert-reply" type="button">Insert last reply</button>
        <span class="chat-input-spacer"></span>
        <button id="oc-send" type="button" class="primary">Send</button>
      </div>
    </div>
  </div>

  <script src="opencode.js?v=3"></script>
  <script src="chat.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
